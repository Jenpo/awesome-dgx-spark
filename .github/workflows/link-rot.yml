name: maintenance

# Two questions on the same weekly cadence:
#   link-check  — is every entry still reachable?
#   entry-drift — is every entry still TRUE?
# The first can fail and open an issue. The second is a reading queue for a human,
# so it only writes to the run summary; a description going stale is not a build break.

on:
  schedule:
    - cron: '0 0 * * 6'   # Saturday 00:00 UTC (Sat 09:00 KST)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # entry-drift reads git blame to date each line

      - name: Check entry links
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if bash .github/scripts/link-check.sh README.md; then
            echo "dead=0" >> "$GITHUB_OUTPUT"
          else
            echo "dead=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Report dead links to an issue
        if: steps.check.outputs.dead == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create link-rot --color B60205 --description "Dead or rotten entry link" --force
          existing=$(gh issue list --label link-rot --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --title "Link rot detected" --label link-rot --body-file report.md
          fi

      - name: Close the link-rot issue once the check is clean
        if: steps.check.outputs.dead == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label link-rot --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All entry links resolve again (0 dead). Closing automatically; a future rot will open a fresh report."
          fi

      - name: Queue entries whose upstream has moved past their description
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the report in the log as well as the summary. A summary that renders
          # empty and a check that produced nothing look identical otherwise, and this
          # step is deliberately non-failing, so its exit code proves nothing.
          report=$(bash .github/scripts/entry-drift.sh README.md 2>&1) || true
          echo "$report"
          {
            echo '## Entry drift'
            echo
            echo 'Entries whose upstream has committed a lot since their line was last written.'
            echo 'Re-read these and update the line if it is no longer the best thing to say.'
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
