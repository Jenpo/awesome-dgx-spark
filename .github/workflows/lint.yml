name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npx awesome-lint

      - name: House-style check
        run: bash .github/scripts/style-check.sh README.md
